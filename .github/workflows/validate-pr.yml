name: "👮‍♂️ IEEE Gatekeeper: Verify"

on:
  pull_request:
    paths:
      - "00_Inbox/**/*.md"
      - "99_System/**/*.py"
      - "tests/**/*.py"

jobs:
  validate-submission:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          pip install python-frontmatter pyyaml

      # ✅ 1) RUN TESTS
      - name: 🧪 Run Tests
        run: |
          python -m unittest discover tests

      # ✅ 2) RUN SMART LINKER
      - name: 🔗 Smart Linker
        run: |
          python 99_System/Scripts/smart_linker.py

      # ✅ 3) RUN GATEKEEPER
      - name: 👮 Gatekeeper Validation
        run: |
          python 99_System/Scripts/validate_pr.py